name: 포케로그 국영수(초등) - GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: 타입 검사 · 수학 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-deps
      - run: pnpm typecheck
      - run: pnpm vitest run test/math test/edu

  sql:
    name: 서버 함수 검사 (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 와 같은 역할(anon) 만들기
        run: psql -v ON_ERROR_STOP=1 -c "create role anon nologin" -c "create role authenticated nologin"
      - name: 스키마 적용 (두 번 실행해도 안전해야 함)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: 서버 함수 동작 검사
        run: psql -v ON_ERROR_STOP=1 -q -f test/edu/sql/schema-test.sql

  build:
    name: 빌드
    needs: [test, sql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-deps
      - name: 빌드 (브라우저 계정 서버 + 원본 에셋 포함)
        run: pnpm build:pages
        env:
          NODE_ENV: production
          # 랭킹 서버(Supabase) 주소와 공개 키: 저장소 Settings → Secrets and variables → Actions → Variables 에서 설정
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # (선택) 학교 검색 인증키: 있으면 한 번에 많은 학교를 불러온다. 없어도 "더 보기"로 검색할 수 있다.
          VITE_NEIS_KEY: ${{ vars.NEIS_KEY }}
      - name: 용량 확인 (GitHub Pages 최대 1GB)
        run: du -sh dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
