name: 포케로그 국영수(초등) - GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: 타입 검사 · 수학 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-deps
      - run: pnpm typecheck
      - run: pnpm vitest run test/math test/edu

  build:
    name: 빌드
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-deps
      - name: 빌드 (브라우저 계정 서버 + 원본 에셋 포함)
        run: pnpm build:pages
        env:
          NODE_ENV: production
          # 랭킹 서버(Supabase) 주소와 공개 키: 저장소 Settings → Secrets and variables → Actions → Variables 에서 설정
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: 용량 확인 (GitHub Pages 최대 1GB)
        run: du -sh dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
